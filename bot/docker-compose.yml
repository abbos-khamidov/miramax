services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55432:5432"
    volumes:
      - miramax_bot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: sh -c "alembic upgrade head && uvicorn services.backend.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client_bot:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: python -m services.client_bot.bot
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  admin_bot:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: python -m services.admin_bot.bot
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  seller_bot:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: python -m services.seller_bot.bot
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  miniapp:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./miniapp:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin_webapp:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./admin-webapp:/app
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  miramax_bot_db:
